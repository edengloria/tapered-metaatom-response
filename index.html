<script>
const data = JSON.parse(document.getElementById("payload").textContent);
const slider = document.getElementById("taperSlider");
const taperValue = document.getElementById("taperValue");
const blocks = document.getElementById("blocks");
const runMeta = document.getElementById("runMeta");
const view = { azimuth: -42 * Math.PI / 180, elevation: 24 * Math.PI / 180 };
let dragState = null;
slider.max = String(data.taperAngles.length - 1);
slider.value = String(Math.max(0, data.taperAngles.findIndex((value) => Math.abs(value) < 1e-9)));
runMeta.textContent = `Fourier order (${data.orders[0]}, ${data.orders[1]}) | ${data.layers} taper slices | ${data.grid}x${data.grid} grid | geometry width ${data.geometryWidthNm} nm`;

function build() {
  data.heights.forEach((height, heightIndex) => {
    const block = document.createElement("section");
    block.className = "height-block";
    const geometry = document.createElement("article");
    geometry.className = "geometry-panel";
    geometry.innerHTML = `<div class="panel-title"><strong>h=${height.toFixed(0)} nm</strong><span>square taper geometry</span></div>`;
    const geoCanvas = canvas("geometry", heightIndex);
    geometry.appendChild(geoCanvas);
    block.appendChild(geometry);

    const plotGrid = document.createElement("section");
    plotGrid.className = "plot-grid";
    data.incidenceAngles.forEach((incidence, incidenceIndex) => {
      data.wavelengths.forEach((wavelength, wavelengthIndex) => {
        const panel = document.createElement("article");
        panel.className = "plot-panel";
        panel.innerHTML = `<div class="panel-title"><strong>${incidence.toFixed(0)} deg</strong><span>${wavelength.toFixed(0)} nm</span></div>`;
        panel.appendChild(canvas("plot", heightIndex, incidenceIndex, wavelengthIndex));
        plotGrid.appendChild(panel);
      });
    });
    block.appendChild(plotGrid);
    blocks.appendChild(block);
  });
}

function canvas(kind, heightIndex, incidenceIndex, wavelengthIndex) {
  const el = document.createElement("canvas");
  el.dataset.kind = kind;
  el.dataset.heightIndex = String(heightIndex);
  if (incidenceIndex !== undefined) el.dataset.incidenceIndex = String(incidenceIndex);
  if (wavelengthIndex !== undefined) el.dataset.wavelengthIndex = String(wavelengthIndex);
  if (kind === "geometry") attachGeometryInteraction(el);
  return el;
}

function attachGeometryInteraction(el) {
  const finish = () => {
    if (!dragState) return;
    el.classList.remove("dragging");
    dragState = null;
  };
  el.addEventListener("pointerdown", (event) => {
    dragState = { pointerId:event.pointerId, startX:event.clientX, startY:event.clientY, azimuth:view.azimuth, elevation:view.elevation };
    el.classList.add("dragging");
    el.setPointerCapture(event.pointerId);
    event.preventDefault();
  });
  el.addEventListener("pointermove", (event) => {
    if (!dragState || dragState.pointerId !== event.pointerId) return;
    view.azimuth = dragState.azimuth + (event.clientX - dragState.startX) * 0.01;
    view.elevation = clamp(dragState.elevation - (event.clientY - dragState.startY) * 0.01, -1.2, 1.2);
    update();
  });
  el.addEventListener("pointerup", finish);
  el.addEventListener("pointercancel", finish);
  el.addEventListener("lostpointercapture", finish);
  el.addEventListener("dblclick", () => {
    view.azimuth = -42 * Math.PI / 180;
    view.elevation = 24 * Math.PI / 180;
    update();
  });
}

function prepare(el) {
  const rect = el.getBoundingClientRect();
  const ratio = window.devicePixelRatio || 1;
  const width = Math.max(240, Math.round(rect.width));
  const height = Math.max(210, Math.round(rect.height));
  if (el.width !== Math.round(width * ratio) || el.height !== Math.round(height * ratio)) {
    el.width = Math.round(width * ratio);
    el.height = Math.round(height * ratio);
  }
  const ctx = el.getContext("2d");
  ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
  ctx.clearRect(0, 0, width, height);
  return { ctx, width, height };
}

function clamp(value, minValue, maxValue) {
  return Math.min(maxValue, Math.max(minValue, value));
}

function projectFactory(width, height, heightNm) {
  const ca = Math.cos(view.azimuth), sa = Math.sin(view.azimuth);
  const ce = Math.cos(view.elevation), se = Math.sin(view.elevation);
  const raw = ([x, y, z]) => {
    const xr = x * ca - y * sa;
    const yr = x * sa + y * ca;
    return [xr, yr * ce - z * se];
  };
  const half = data.periodNm / 2;
  const samples = [];
  [-half, half].forEach((x) => [-half, half].forEach((y) => [0, heightNm].forEach((z) => samples.push(raw([x, y, z])))));
  const xs = samples.map((p) => p[0]), ys = samples.map((p) => p[1]);
  const minX = Math.min(...xs), maxX = Math.max(...xs), minY = Math.min(...ys), maxY = Math.max(...ys);
  const margin = { left:26, right:20, top:58, bottom:42 };
  const scale = Math.min((width - margin.left - margin.right) / (maxX - minX), (height - margin.top - margin.bottom) / (maxY - minY));
  const offsetX = margin.left + (width - margin.left - margin.right - (maxX - minX) * scale) / 2 - minX * scale;
  const offsetY = margin.top + (height - margin.top - margin.bottom - (maxY - minY) * scale) / 2 - minY * scale;
  return ([x, y, z]) => {
    const [px, py] = raw([x, y, z]);
    return { x: offsetX + px * scale, y: offsetY + py * scale };
  };
}

function squareFootprint(size) {
  const h = size / 2;
  return [[-h,-h], [h,-h], [h,h], [-h,h]];
}

function drawPoly(ctx, points, fill, stroke, lineWidth) {
  ctx.beginPath();
  ctx.moveTo(points[0].x, points[0].y);
  for (let i = 1; i < points.length; i += 1) ctx.lineTo(points[i].x, points[i].y);
  ctx.closePath();
  ctx.fillStyle = fill;
  ctx.fill();
  if (stroke) {
    ctx.strokeStyle = stroke;
    ctx.lineWidth = lineWidth;
    ctx.stroke();
  }
}

function drawGeometry(el, taperIndex) {
  const { ctx, width, height } = prepare(el);
  const heightIndex = Number(el.dataset.heightIndex);
  const heightNm = data.heights[heightIndex];
  const widths = data.layerWidths[heightIndex][taperIndex][nearestWidthIndex(data.geometryWidthNm)];
  if (!widths || widths.some((value) => value === null || !Number.isFinite(value))) return;
  const project = projectFactory(width, height, heightNm);
  const periodHalf = data.periodNm / 2;
  drawPoly(ctx, [[-periodHalf,-periodHalf,0], [periodHalf,-periodHalf,0], [periodHalf,periodHalf,0], [-periodHalf,periodHalf,0]].map(project), "rgba(0,0,0,0.025)", "rgba(90,100,112,.28)", 1);
  const dz = heightNm / data.layers;
  for (let layer = 0; layer < data.layers; layer += 1) {
    const z0 = layer * dz;
    const z1 = (layer + 1) * dz;
    const bottom = squareFootprint(widths[layer]).map(([x,y]) => project([x,y,z0]));
    const top = squareFootprint(widths[layer]).map(([x,y]) => project([x,y,z1]));
    for (let i = 0; i < bottom.length; i += 1) {
      const j = (i + 1) % bottom.length;
      drawPoly(ctx, [bottom[i], bottom[j], top[j], top[i]], "rgba(74,119,172,.45)", "rgba(22,28,36,.18)", .55);
    }
    drawPoly(ctx, top, "rgba(74,119,172,.72)", "rgba(22,28,36,.32)", .75);
  }
  ctx.fillStyle = "#172026";
  ctx.font = "12px ui-sans-serif, system-ui, sans-serif";
  ctx.fillText(`mid ${data.geometryWidthNm.toFixed(0)} nm`, 12, 20);
  ctx.fillText(`bottom ${widths[0].toFixed(1)} nm`, 12, 38);
  ctx.fillText(`top ${widths[widths.length - 1].toFixed(1)} nm`, 12, 56);
}

function nearestWidthIndex(value) {
  let best = 0;
  let bestDistance = Infinity;
  data.widths.forEach((width, index) => {
    const distance = Math.abs(width - value);
    if (distance < bestDistance) {
      best = index;
      bestDistance = distance;
    }
  });
  return best;
}

function drawPlot(el, taperIndex) {
  const { ctx, width, height } = prepare(el);
  const h = Number(el.dataset.heightIndex);
  const inc = Number(el.dataset.incidenceIndex);
  const wl = Number(el.dataset.wavelengthIndex);
  const trans = data.trans[h][taperIndex][inc][wl];
  const phase = data.phase[h][taperIndex][inc][wl];
  const pad = { left:42, right:42, top:14, bottom:32 };
  const plotW = width - pad.left - pad.right;
  const plotH = height - pad.top - pad.bottom;
  const xMin = data.widths[0], xMax = data.widths[data.widths.length - 1];
  const mapX = (x) => pad.left + ((x - xMin) / (xMax - xMin)) * plotW;
  const mapT = (y) => pad.top + (1 - y) * plotH;
  const mapP = (y) => pad.top + (1 - y / (2 * Math.PI)) * plotH;
  ctx.fillStyle = "#fff";
  ctx.fillRect(0, 0, width, height);
  ctx.strokeStyle = "#d7dde3";
  ctx.strokeRect(pad.left, pad.top, plotW, plotH);
  ctx.font = "11px ui-sans-serif, system-ui, sans-serif";
  ctx.fillStyle = "#5c6670";
  ctx.textAlign = "right";
  ctx.textBaseline = "middle";
  [0, .25, .5, .75, 1].forEach((tick) => {
    const y = mapT(tick);
    ctx.strokeStyle = "#e8edf2";
    ctx.beginPath();
    ctx.moveTo(pad.left, y);
    ctx.lineTo(pad.left + plotW, y);
    ctx.stroke();
    ctx.fillText(tick.toFixed(tick === 0 || tick === 1 ? 0 : 2), pad.left - 6, y);
  });
  ctx.textAlign = "left";
  ["0", "π", "2π"].forEach((label, index) => {
    const y = mapP(index * Math.PI);
    ctx.fillStyle = "#d62728";
    ctx.fillText(label, pad.left + plotW + 7, y);
  });
  line(ctx, data.widths, trans, mapX, mapT, "#1f77b4", "circle");
  line(ctx, data.widths, phase, mapX, mapP, "#d62728", "square");
  ctx.fillStyle = "#5c6670";
  ctx.textAlign = "center";
  ctx.textBaseline = "top";
  [xMin, (xMin + xMax) / 2, xMax].forEach((x) => ctx.fillText(String(Math.round(x)), mapX(x), pad.top + plotH + 8));
}

function line(ctx, xs, ys, mapX, mapY, color, marker) {
  ctx.strokeStyle = color;
  ctx.lineWidth = 1.8;
  ctx.beginPath();
  let drawing = false;
  xs.forEach((x, index) => {
    if (ys[index] === null || !Number.isFinite(ys[index])) {
      drawing = false;
      return;
    }
    const px = mapX(x);
    const py = mapY(ys[index]);
    if (!drawing) {
      ctx.moveTo(px, py);
      drawing = true;
    }
    else ctx.lineTo(px, py);
  });
  ctx.stroke();
  ctx.fillStyle = color;
  xs.forEach((x, index) => {
    if (ys[index] === null || !Number.isFinite(ys[index])) return;
    const px = mapX(x);
    const py = mapY(ys[index]);
    ctx.beginPath();
    if (marker === "circle") {
      ctx.arc(px, py, 2.4, 0, 2 * Math.PI);
    } else {
      ctx.rect(px - 2.2, py - 2.2, 4.4, 4.4);
    }
    ctx.fill();
  });
}

function update() {
  const taperIndex = Number(slider.value);
  taperValue.textContent = `${data.taperAngles[taperIndex].toFixed(1)} deg`;
  document.querySelectorAll("canvas").forEach((el) => {
    if (el.dataset.kind === "geometry") drawGeometry(el, taperIndex);
    else drawPlot(el, taperIndex);
  });
}

build();
slider.addEventListener("input", update);
window.addEventListener("resize", update);
update();
</script>
</body>
</html>
