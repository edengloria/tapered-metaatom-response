<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tapered meta-atom response</title>
<style>
:root {
  color-scheme: light;
  --text: #172026;
  --muted: #5c6670;
  --line: #d7dde3;
  --panel: #ffffff;
  --bg: #f5f7f8;
  --accent: #1f6feb;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  background: var(--bg);
  color: var(--text);
}
main {
  max-width: 1720px;
  margin: 0 auto;
  padding: 18px 18px 28px;
}
.toolbar {
  position: sticky;
  top: 0;
  z-index: 3;
  display: grid;
  grid-template-columns: auto minmax(260px, 1fr) auto;
  align-items: center;
  gap: 16px;
  padding: 14px 0 16px;
  background: rgba(245, 247, 248, 0.95);
  backdrop-filter: blur(6px);
}
h1 {
  margin: 0;
  font-size: 20px;
  font-weight: 700;
}
.title-block {
  min-width: 0;
}
.run-meta {
  display: block;
  margin-top: 3px;
  color: var(--muted);
  font-size: 12px;
  font-weight: 650;
}
.angle-readout {
  display: flex;
  align-items: baseline;
  justify-content: flex-end;
  gap: 8px;
  font-variant-numeric: tabular-nums;
}
#angleValue {
  font-size: 22px;
  font-weight: 700;
}
input[type="range"] {
  width: 100%;
  accent-color: var(--accent);
}
.rows {
  display: grid;
  gap: 14px;
}
.shape-row {
  display: grid;
  grid-template-columns: minmax(260px, 0.95fr) repeat(3, minmax(260px, 1fr));
  gap: 12px;
  align-items: stretch;
}
.panel {
  min-width: 0;
  padding: 10px 10px 8px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: var(--panel);
  box-shadow: 0 1px 2px rgba(17, 24, 39, 0.04);
}
.panel-title {
  display: flex;
  justify-content: space-between;
  gap: 8px;
  margin: 0 0 6px;
  color: var(--muted);
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 0;
  text-transform: uppercase;
}
.panel-title strong {
  color: var(--text);
  font-size: 13px;
  text-transform: none;
}
canvas {
  display: block;
  width: 100%;
  height: 220px;
}
canvas[data-kind="geometry"] {
  height: 300px;
  cursor: grab;
  touch-action: none;
}
canvas[data-kind="geometry"].dragging {
  cursor: grabbing;
}
@media (max-width: 1180px) {
  .shape-row { grid-template-columns: 1fr 1fr; }
}
@media (max-width: 720px) {
  main { padding: 12px; }
  .toolbar { grid-template-columns: 1fr; gap: 8px; }
  .angle-readout { justify-content: flex-start; }
  .shape-row { grid-template-columns: 1fr; }
}
</style>
</head>

.010583048829296064,6.973684386028452e-07],[2.911451422104488e-05,0.035704183234174576,1.4807901622389386e-05],[2.9316209847244137e-05,0.02410087417050692,2.31011505240441e-05],[3.3883333479038655e-05,0.07591067413492422,2.0259804696303197e-05],[5.521704915248067e-05,0.024399872764607155,5.545740833469111e-06],[1.321929196322551e-06,0.007426816722240545,1.1865963058595077e-06],[9.772487009042508e-06,0.005591287356600407,5.14476400984123e-06],[2.691878916219953e-05,5.576616433893187,1.198900456906719e-06],[4.726020235894883e-06,0.001587157627285782,4.057379797932597e-06],[3.8260365058516046e-05,0.03257182975876016,7.493525380377885e-06],[7.418414057830938e-05,0.000785644326377399,5.804489394482444e-06],[2.777050616258857e-05,0.002388941726168713,1.0449346860516166e-05],[5.603298512618338e-05,0.025835592032997293,0.00202674276954481],[3.31697194817874e-05,19.085185606138825,9.516096272760307e-05],[6.279413665090538e-05,5.031756777305522e-05,8.122003442758104e-05],[2.560922909261371e-05,0.008532067365799475,5.781449358696323e-05],[7.35982687042203e-06,0.08499204566781501,1.9698004411113493e-05],[0.00012736486120699413,0.04017046564361579,0.0003911877999555221],[2.707795779487293e-05,0.3467118557702048,1.8504332547031847e-05],[9.48460905989456e-06,0.001718575885886599,0.000698928396667685],[0.00016129976544298943,0.0035882904656917188,5.83839913563373e-06],[5.668465427287626e-05,0.0010496481328263396,6.29744707879226e-06],[0.00020206905811880716,0.008933864395071956,0.00015174205703413724],[8.068251792306773e-06,0.2843025910270199,2.1264862722610586e-06],[9.802905031640479e-05,0.25339814478822964,3.815746291338993e-06],[0.00033606960129071154,0.9587448119062741,6.471247549463043e-05],[0.00010748651009941232,0.4659108861302671,8.130636924027025e-05],[0.0055700153669461586,56.782453619775865,2.7662777683793323e-05]]],"periodNm":435.0,"heightNm":950.0,"layers":31,"minFeatureNm":95.0,"maxExtentNm":335.0,"crossArmFraction":0.45,"yLimits":{"trans":[0.0,1.0781260877621892],"phase":[-201.01006445158353,201.01006445158353],"leakage":[0.0,119.67170570276132]}}</script>
<script>
const data = JSON.parse(document.getElementById("payload").textContent);
const waveColors = ["#2a6fbb", "#2f9e44", "#c44536", "#805ad5", "#555555"];
const shapeColors = { cylinder: "#4f83c4", square: "#d17a38", cross: "#5f9b72" };
const metrics = [
  { key: "trans", title: "co-pol transmittance", values: data.trans, yLimit: data.yLimits.trans },
  { key: "phase", title: "phase shift from 0 deg", values: data.phase, yLimit: data.yLimits.phase },
  { key: "leakage", title: "cross-pol leakage (%)", values: data.leakage, yLimit: data.yLimits.leakage }
];
const slider = document.getElementById("angleSlider");
const angleValue = document.getElementById("angleValue");
const rows = document.getElementById("rows");
const viewState = {
  azimuth: -45 * Math.PI / 180,
  elevation: 25 * Math.PI / 180
};
let dragState = null;
slider.max = String(data.angles.length - 1);

function canvasFor(kind, shapeIndex, metricIndex) {
  const canvas = document.createElement("canvas");
  canvas.dataset.kind = kind;
  canvas.dataset.shapeIndex = String(shapeIndex);
  if (metricIndex !== undefined) canvas.dataset.metricIndex = String(metricIndex);
  if (kind === "geometry") attachGeometryInteraction(canvas);
  return canvas;
}

function clamp(value, minValue, maxValue) {
  return Math.min(maxValue, Math.max(minValue, value));
}

function attachGeometryInteraction(canvas) {
  const finishDrag = () => {
    if (!dragState) return;
    canvas.classList.remove("dragging");
    dragState = null;
  };
  canvas.addEventListener("pointerdown", (event) => {
    dragState = {
      pointerId: event.pointerId,
      startX: event.clientX,
      startY: event.clientY,
      azimuth: viewState.azimuth,
      elevation: viewState.elevation
    };
    canvas.classList.add("dragging");
    canvas.setPointerCapture(event.pointerId);
    event.preventDefault();
  });
  canvas.addEventListener("pointermove", (event) => {
    if (!dragState || dragState.pointerId !== event.pointerId) return;
    const dx = event.clientX - dragState.startX;
    const dy = event.clientY - dragState.startY;
    viewState.azimuth = dragState.azimuth + dx * 0.01;
    viewState.elevation = clamp(dragState.elevation - dy * 0.01, -80 * Math.PI / 180, 80 * Math.PI / 180);
    update();
  });
  canvas.addEventListener("pointerup", finishDrag);
  canvas.addEventListener("pointercancel", finishDrag);
  canvas.addEventListener("lostpointercapture", finishDrag);
  canvas.addEventListener("dblclick", () => {
    viewState.azimuth = -45 * Math.PI / 180;
    viewState.elevation = 25 * Math.PI / 180;
    update();
  });
}

function buildRows() {
  data.shapes.forEach((shape, shapeIndex) => {
    const row = document.createElement("section");
    row.className = "shape-row";
    const geometry = document.createElement("article");
    geometry.className = "panel";
    geometry.innerHTML = `<div class="panel-title"><strong>${shape}</strong><span>3D RCWA layers</span></div>`;
    geometry.appendChild(canvasFor("geometry", shapeIndex));
    row.appendChild(geometry);
    metrics.forEach((metric, metricIndex) => {
      const panel = document.createElement("article");
      panel.className = "panel";
      panel.innerHTML = `<div class="panel-title"><strong>${shape}</strong><span>${metric.title}</span></div>`;
      panel.appendChild(canvasFor("plot", shapeIndex, metricIndex));
      row.appendChild(panel);
    });
    rows.appendChild(row);
  });
}

function prepareCanvas(canvas) {
  const rect = canvas.getBoundingClientRect();
  const ratio = window.devicePixelRatio || 1;
  const width = Math.max(240, Math.round(rect.width));
  const height = Math.max(190, Math.round(rect.height));
  if (canvas.width !== Math.round(width * ratio) || canvas.height !== Math.round(height * ratio)) {
    canvas.width = Math.round(width * ratio);
    canvas.height = Math.round(height * ratio);
  }
  const ctx = canvas.getContext("2d");
  ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
  ctx.clearRect(0, 0, width, height);
  return { ctx, width, height };
}

function hexToRgb(hex) {
  const value = hex.replace("#", "");
  return {
    r: parseInt(value.slice(0, 2), 16),
    g: parseInt(value.slice(2, 4), 16),
    b: parseInt(value.slice(4, 6), 16)
  };
}

function rgba(hex, alpha) {
  const c = hexToRgb(hex);
  return `rgba(${c.r}, ${c.g}, ${c.b}, ${alpha})`;
}

function footprint(shape, size) {
  const half = size / 2;
  if (shape === "cylinder") {
    const points = [];
    const segments = 48;
    for (let i = 0; i < segments; i += 1) {
      const t = (2 * Math.PI * i) / segments;
      points.push([Math.cos(t) * half, Math.sin(t) * half]);
    }
    return points;
  }
  if (shape === "square") {
    return [[-half, -half], [half, -half], [half, half], [-half, half]];
  }
  const arm = Math.min(size, Math.max(data.minFeatureNm, data.crossArmFraction * size));
  const a = arm / 2;
  return [
    [-half, -a], [-a, -a], [-a, -half], [a, -half], [a, -a], [half, -a],
    [half, a], [a, a], [a, half], [-a, half], [-a, a], [-half, a]
  ];
}

function projectFactory(width, height) {
  const azimuth = viewState.azimuth;
  const elevation = viewState.elevation;
  const cosA = Math.cos(azimuth);
  const sinA = Math.sin(azimuth);
  const cosE = Math.cos(elevation);
  const sinE = Math.sin(elevation);
  const raw = ([x, y, z]) => {
    const xr = x * cosA - y * sinA;
    const yr = x * sinA + y * cosA;
    return [xr, yr * cosE - z * sinE];
  };
  const half = data.periodNm / 2;
  const corners = [];
  [-half, half].forEach((x) => {
    [-half, half].forEach((y) => {
      [0, data.heightNm].forEach((z) => corners.push(raw([x, y, z])));
    });
  });
  const xs = corners.map((point) => point[0]);
  const ys = corners.map((point) => point[1]);
  const minX = Math.min(...xs);
  const maxX = Math.max(...xs);
  const minY = Math.min(...ys);
  const maxY = Math.max(...ys);
  const margin = {
    left: 22,
    right: 18,
    top: 42,
    bottom: 34
  };
  const scale = Math.min(
    (width - margin.left - margin.right) / (maxX - minX),
    (height - margin.top - margin.bottom) / (maxY - minY)
  );
  const offsetX = margin.left + (width - margin.left - margin.right - (maxX - minX) * scale) / 2 - minX * scale;
  const offsetY = margin.top + (height - margin.top - margin.bottom - (maxY - minY) * scale) / 2 - minY * scale;
  return ([x, y, z]) => {
    const [px, py] = raw([x, y, z]);
    return { x: offsetX + px * scale, y: offsetY + py * scale };
  };
}

function drawPolygon(ctx, points, fill, stroke, width) {
  if (!points.length) return;
  ctx.beginPath();
  ctx.moveTo(points[0].x, points[0].y);
  for (let i = 1; i < points.length; i += 1) ctx.lineTo(points[i].x, points[i].y);
  ctx.closePath();
  ctx.fillStyle = fill;
  ctx.fill();
  if (stroke) {
    ctx.strokeStyle = stroke;
    ctx.lineWidth = width;
    ctx.stroke();
  }
}

function drawGeometry(canvas, shapeIndex, angleIndex) {
  const { ctx, width, height } = prepareCanvas(canvas);
  const shape = data.shapes[shapeIndex];
  const color = shapeColors[shape] || "#5277a8";
  const project = projectFactory(width, height);
  const period = data.periodNm / 2;
  const base = [[-period, -period, 0], [period, -period, 0], [period, period, 0], [-period, period, 0]].map(project);
  drawPolygon(ctx, base, "rgba(0,0,0,0.025)", "rgba(90,100,112,0.28)", 1);
  const sizes = data.sizes[shapeIndex][angleIndex];
  const dz = data.heightNm / sizes.length;
  for (let layer = 0; layer < sizes.length; layer += 1) {
    const z0 = layer * dz;
    const z1 = (layer + 1) * dz;
    const poly = footprint(shape, sizes[layer]);
    const bottom = poly.map(([x, y]) => project([x, y, z0]));
    const top = poly.map(([x, y]) => project([x, y, z1]));
    for (let i = 0; i < poly.length; i += 1) {
      const j = (i + 1) % poly.length;
      const side = [bottom[i], bottom[j], top[j], top[i]];
      drawPolygon(ctx, side, rgba(color, 0.46), "rgba(22,28,36,0.18)", 0.45);
    }
    drawPolygon(ctx, top, rgba(color, 0.70), "rgba(22,28,36,0.28)", 0.55);
  }
  ctx.fillStyle = "#172026";
  ctx.font = "12px ui-sans-serif, system-ui, sans-serif";
  ctx.fillText(`bottom ${sizes[0].toFixed(1)} nm`, 12, 18);
  ctx.fillText(`top ${sizes[sizes.length - 1].toFixed(1)} nm`, 12, 34);
  ctx.fillStyle = "#5c6670";
  ctx.fillText(`${sizes.length} slices, dz ${(data.heightNm / sizes.length).toFixed(2)} nm`, 12, height - 12);
}

function drawPlot(canvas, shapeIndex, metricIndex, angleIndex) {
  const { ctx, width, height } = prepareCanvas(canvas);
  const metric = metrics[metricIndex];
  const values = metric.values[shapeIndex];
  const pad = { left: 46, right: 14, top: 16, bottom: 34 };
  const plotW = width - pad.left - pad.right;
  const plotH = height - pad.top - pad.bottom;
  const xMin = Math.min(...data.angles);
  const xMax = Math.max(...data.angles);
  const yMin = metric.yLimit[0];
  const yMax = metric.yLimit[1];
  const mapX = (x) => pad.left + ((x - xMin) / (xMax - xMin)) * plotW;
  const mapY = (y) => pad.top + (1 - (y - yMin) / (yMax - yMin)) * plotH;
  ctx.fillStyle = "#ffffff";
  ctx.fillRect(0, 0, width, height);
  ctx.strokeStyle = "#d7dde3";
  ctx.lineWidth = 1;
  ctx.strokeRect(pad.left, pad.top, plotW, plotH);
  ctx.font = "11px ui-sans-serif, system-ui, sans-serif";
  ctx.fillStyle = "#5c6670";
  ctx.textAlign = "right";
  ctx.textBaseline = "middle";
  for (let i = 0; i <= 4; i += 1) {
    const y = yMin + ((yMax - yMin) * i) / 4;
    const py = mapY(y);
    ctx.strokeStyle = "#e5e9ee";
    ctx.beginPath();
    ctx.moveTo(pad.left, py);
    ctx.lineTo(pad.left + plotW, py);
    ctx.stroke();
    ctx.fillText(y.toFixed(metric.key === "trans" ? 2 : 0), pad.left - 6, py);
  }
  ctx.textAlign = "center";
  ctx.textBaseline = "top";
  [xMin, 0, xMax].forEach((x) => {
    const px = mapX(x);
    ctx.fillText(x.toFixed(0), px, pad.top + plotH + 8);
  });
  data.wavelengths.forEach((wavelength, wavelengthIndex) => {
    ctx.strokeStyle = waveColors[wavelengthIndex % waveColors.length];
    ctx.lineWidth = 2;
    ctx.beginPath();
    values.forEach((row, i) => {
      const px = mapX(data.angles[i]);
      const py = mapY(row[wavelengthIndex]);
      if (i === 0) ctx.moveTo(px, py);
      else ctx.lineTo(px, py);
    });
    ctx.stroke();
    const currentX = mapX(data.angles[angleIndex]);
    const currentY = mapY(values[angleIndex][wavelengthIndex]);
    ctx.fillStyle = waveColors[wavelengthIndex % waveColors.length];
    ctx.strokeStyle = "#101820";
    ctx.lineWidth = 1.1;
    ctx.beginPath();
    ctx.arc(currentX, currentY, 4.5, 0, 2 * Math.PI);
    ctx.fill();
    ctx.stroke();
  });
  const cursorX = mapX(data.angles[angleIndex]);
  ctx.strokeStyle = "rgba(20,28,35,0.58)";
  ctx.setLineDash([4, 4]);
  ctx.beginPath();
  ctx.moveTo(cursorX, pad.top);
  ctx.lineTo(cursorX, pad.top + plotH);
  ctx.stroke();
  ctx.setLineDash([]);
  ctx.textAlign = "left";
  ctx.textBaseline = "top";
  data.wavelengths.forEach((wavelength, i) => {
    const x = pad.left + 8 + i * 70;
    ctx.fillStyle = waveColors[i % waveColors.length];
    ctx.fillRect(x, pad.top + 8, 10, 10);
    ctx.fillStyle = "#5c6670";
    ctx.fillText(`${Number(wavelength).toFixed(0)} nm`, x + 14, pad.top + 6);
  });
}

function update() {
  const index = Number(slider.value);
  angleValue.textContent = `${data.angles[index].toFixed(1)} deg`;
  document.querySelectorAll("canvas").forEach((canvas) => {
    const shapeIndex = Number(canvas.dataset.shapeIndex);
    if (canvas.dataset.kind === "geometry") {
      drawGeometry(canvas, shapeIndex, index);
    } else {
      drawPlot(canvas, shapeIndex, Number(canvas.dataset.metricIndex), index);
    }
  });
}

buildRows();
slider.addEventListener("input", update);
window.addEventListener("resize", update);
update();
</script>
